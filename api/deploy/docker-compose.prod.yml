# Production compose — runs prebuilt GHCR images instead of building.
# Layout matches the dev stack: web (nginx SPA + proxy) → vishnu api → Postgres.
#
# Usage (from api/):
#   docker compose -f deploy/docker-compose.prod.yml pull
#   docker compose -f deploy/docker-compose.prod.yml up -d
# or use deploy/deploy.sh, which wraps pull + migrate + recreate + health check.
services:
  web:
    image: ghcr.io/andikapradanaarif/vishnu-web:${VISHNU_WEB_TAG:-latest}
    container_name: vishnu-web
    restart: unless-stopped
    environment:
      # Where nginx forwards /api + /p — the compose-network api here,
      # or any reachable URL (e.g. https://api.example.com) when it
      # lives on another host/domain.
      VISHNU_API_UPSTREAM: ${VISHNU_API_UPSTREAM:-http://vishnu:8080}
    ports:
      - "127.0.0.1:${VISHNU_HOST_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    depends_on:
      vishnu:
        condition: service_healthy

  vishnu:
    image: ghcr.io/andikapradanaarif/vishnu-api:${VISHNU_API_TAG:-latest}
    container_name: vishnu
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: vishnu-db
      DB_PORT: "5432"
    ports:
      - "127.0.0.1:${VISHNU_API_PORT:-8081}:8080"
    volumes:
      - vishnu-data:/data
      # Git credentials for clone/ls-remote — key material only (github
      # host keys are baked into the image). `~` expands to the
      # composing user's home, so under sudo or a different deploy
      # user set VISHNU_SSH_DIR to the right account's .ssh.
      - ${VISHNU_SSH_DIR:-~/.ssh}:/root/.ssh:ro
      # Crush global config + data (model selection, provider creds
      # incl. OAuth tokens) — the container's crush runs as root, so
      # this mounts the composing user's dirs, not root's. Writable:
      # OAuth refresh writes tokens back. Set VISHNU_CRUSH_*_DIR to the
      # right account's paths under sudo / a different deploy user.
      - ${VISHNU_CRUSH_CONFIG_DIR:-~/.config/crush}:/root/.config/crush
      - ${VISHNU_CRUSH_DATA_DIR:-~/.local/share/crush}:/root/.local/share/crush
      # Link mode needs the host directory mounted at the same path:
      # - /srv/projects:/srv/projects
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: vishnu-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required — set it in deploy/.env}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS is required — set it in deploy/.env}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required — set it in deploy/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  vishnu-data:
